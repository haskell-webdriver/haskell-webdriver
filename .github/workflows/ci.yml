name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on main each get their own group, so a merge never cancels another merge's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    env:
      TEST_RUNS_ARCHIVE: test-runs-${{ github.run_number }}-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.browser }}.tgz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
        ghc:
        - "9.2.8"
        - "9.4.8"
        - "9.6.6"
        - "9.8.4"
        - "9.10.3"
        - "9.12.4"
        - "9.14.1"
        browser:
        - firefox
        - chrome
        exclude:
        # We can't install Firefox on macOS using Nix, and it's not immediately clear how you can
        # set up Firefox + geckodriver on Github Actions on macOS
        - os: macOS-latest
          browser: firefox

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      if: runner.os != 'Windows'
      with:
        # release-24.05
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/74435c9234c751e6786c5f3fd34ff6b0f0c13bd1.tar.gz

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        # https://github.com/actions/runner-images/issues/14940
        sudo xcode-select -s /Library/Developer/CommandLineTools
        # https://gitlab.haskell.org/ghc/ghc/-/issues/20592#note_391266
        echo "C_INCLUDE_PATH=`xcrun --show-sdk-path`/usr/include/ffi" >> "$GITHUB_ENV"

    - uses: haskell-actions/setup@v2
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: "latest"

    - name: Freeze
      run: |
        cabal update
        cabal configure --enable-tests
        cabal freeze

    - uses: nix-community/cache-nix-action@v7
      name: Cache /nix/store
      with:
        primary-key: nix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/Main.hs') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.browser }}-
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G

    - uses: actions/cache@v5
      name: Cache ~/.cabal/store
      with:
        path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}-key2

    - name: Build
      run: |
        cabal build all \
          --extra-include-dirs=/opt/homebrew/include \
          --extra-lib-dirs=/opt/homebrew/lib

    - name: Test
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          echo "Running on macOS!"
          echo "firefox: $(which firefox)"
          echo "geckodriver: $(which geckodriver)"
        fi

        cabal test all \
          --test-option="--headless-tests" \
          --test-option="--use-${{ matrix.browser }}" \
          --test-option="--webdriver-chrome-no-sandbox" \
          --test-option="--fixed-root" \
          --test-option="test_runs/run"

    - name: Archive test_runs
      if: always()
      run: |
        if [ -d test_runs ]; then
          tar --exclude=gcroot -czf "$TEST_RUNS_ARCHIVE" test_runs
        fi

    - name: Upload test_runs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        path: ${{ env.TEST_RUNS_ARCHIVE }}
        archive: false
        retention-days: 7

  stack:
    name: stack / ghc ${{ matrix.ghc }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    env:
      TEST_RUNS_ARCHIVE: test-runs-stack-${{ matrix.ghc }}-${{ matrix.browser }}.tgz
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - "9.2.8"
        - "9.4.8"
        - "9.6.7"
        - "9.8.4"
        - "9.10.3"
        - "9.12.4"
        browser:
        - firefox
        - chrome

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      if: runner.os != 'Windows'
      with:
        # release-24.05
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/74435c9234c751e6786c5f3fd34ff6b0f0c13bd1.tar.gz

    - uses: haskell-actions/setup@v2
      name: Setup Haskell Stack
      with:
        enable-stack: true
        ghc-version: ${{ matrix.ghc }}
        stack-version: "latest"

    - uses: nix-community/cache-nix-action@v7
      name: Cache /nix/store
      with:
        primary-key: nix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/Main.hs') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.browser }}-
        gc-max-store-size-linux: 5G

    - uses: actions/cache/restore@v5
      name: Cache restore ~/.stack
      id: cache-restore
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.ghc }}-stack

    - name: Build
      run: |
        stack build --stack-yaml stack/stack-${{ matrix.ghc }}.yaml --system-ghc --test --bench --no-run-tests --no-run-benchmarks

    - name: Test
      run: |
        stack test --stack-yaml stack/stack-${{ matrix.ghc }}.yaml --system-ghc --ta="--headless-tests --use-${{ matrix.browser }} --webdriver-chrome-no-sandbox --fixed-root test_runs/run --print-failures"

    - name: Archive test_runs
      if: always()
      run: |
        if [ -d test_runs ]; then
          tar --exclude=gcroot -czf "$TEST_RUNS_ARCHIVE" test_runs
        fi

    - name: Upload test_runs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        path: ${{ env.TEST_RUNS_ARCHIVE }}
        archive: false
        retention-days: 7

    - uses: actions/cache/save@v5
      if: ${{ !cancelled() && steps.cache-restore.outputs.cache-hit != 'true' }}
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.ghc }}-stack
