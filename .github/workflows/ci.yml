name: ci

on:
  pull_request:
  # Other branches are tested through their pull requests.
  push:
    branches: [main]
  # Runs CI by hand on a branch without a pull request.
  workflow_dispatch:

# A new push to a pull request cancels its run in progress. Other runs each get their own group,
# so runs on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]
        ghc:
        # - "8.10.7"
        - "9.0.2"
        - "9.2.8"
        - "9.4.8"
        - "9.6.6"
        - "9.8.4"
        - "9.10.2"
        - "9.12.2"
        browser:
        - firefox
        - chrome
        exclude:
        # These don't work on GitHub CI anymore because they need llvm@13, which became
        # disabled on 12/31/2024
        - os: macOS-latest
          ghc: 8.10.7
        - os: macOS-latest
          ghc: 9.0.2
        # We can't install Firefox on macOS using Nix, and it's not immediately clear how you can
        # set up Firefox + geckodriver on Github Actions on macOS
        - os: macOS-latest
          browser: firefox

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      if: runner.os != 'Windows'
      with:
        # release-24.05
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/74435c9234c751e6786c5f3fd34ff6b0f0c13bd1.tar.gz

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        # https://gitlab.haskell.org/ghc/ghc/-/issues/20592#note_391266
        echo "C_INCLUDE_PATH=`xcrun --show-sdk-path`/usr/include/ffi" >> "$GITHUB_ENV"

    - uses: haskell-actions/setup@v2
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: "latest"

    - name: Freeze
      run: |
        cabal update
        cabal configure --enable-tests
        cabal freeze

    - uses: nix-community/cache-nix-action@v7
      name: Cache /nix/store
      with:
        primary-key: nix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/Main.hs') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.browser }}-
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G

    - uses: actions/cache@v5
      name: Cache ~/.cabal/store
      with:
        path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}-key2

    - name: Build
      run: |
        cabal build all \
          --extra-include-dirs=/opt/homebrew/include \
          --extra-lib-dirs=/opt/homebrew/lib

    - name: Test
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          echo "Running on macOS!"
          echo "firefox: $(which firefox)"
          echo "geckodriver: $(which geckodriver)"
        fi

        cabal test all \
          --test-option="--headless-tests" \
          --test-option="--use-${{ matrix.browser }}" \
          --test-option="--webdriver-chrome-no-sandbox" \
          --test-option="--fixed-root" \
          --test-option="test_runs/run"

    - name: Archive test_runs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-runs-${{ github.run_number }}-${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.browser }}
        path: |
          test_runs
          !test_runs/**/gcroot
        retention-days: 7

  # Builds with the stack.yaml resolver's GHC. The cabal job covers the other GHC versions.
  stack:
    name: stack / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
        - firefox
        - chrome

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      if: runner.os != 'Windows'
      with:
        # release-24.05
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/74435c9234c751e6786c5f3fd34ff6b0f0c13bd1.tar.gz

    - uses: haskell-actions/setup@v2
      name: Setup Haskell Stack
      with:
        enable-stack: true
        # Stack installs the resolver's GHC itself, into the cached ~/.stack.
        stack-no-global: true
        stack-version: "latest"

    - uses: nix-community/cache-nix-action@v7
      name: Cache /nix/store
      with:
        primary-key: nix-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/Main.hs') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.browser }}-
        gc-max-store-size-linux: 5G

    - uses: actions/cache/restore@v5
      name: Cache restore ~/.stack
      id: cache-restore
      with:
        path: ~/.stack
        # Changing the resolver or the dependencies saves a new cache, seeded from the newest old one.
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
        restore-keys: ${{ runner.os }}-stack-

    - name: Build
      run: |
        stack build --system-ghc --test --bench --no-run-tests --no-run-benchmarks

    - name: Test
      run: |
        stack test --system-ghc --ta="--headless-tests --use-${{ matrix.browser }} --webdriver-chrome-no-sandbox --fixed-root test_runs/run --print-failures"

    - name: Archive test_runs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-runs-stack-${{ matrix.browser }}
        path: |
          test_runs
          !test_runs/**/gcroot
        retention-days: 7

    - uses: actions/cache/save@v5
      # A cancelled job may have stopped mid-build, so it doesn't save.
      if: ${{ !cancelled() && steps.cache-restore.outputs.cache-hit != 'true' }}
      with:
        path: ~/.stack
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
