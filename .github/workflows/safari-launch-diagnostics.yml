name: Safari launch diagnostics

on:
  push:
    branches: [diagnose-safari-launch]

jobs:
  stress:
    name: ${{ matrix.runner }} / ${{ matrix.modes }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26
          modes: sel3
        - runner: xcode-27
          modes: sel3
        - runner: macos-15
          modes: sel3
        - runner: macos-14
          modes: sel3
        - runner: macos-26
          modes: sel4new
        - runner: macos-26
          modes: bare-eph
        - runner: xcode-27
          modes: sel4new
        - runner: macos-14
          modes: bare-eph

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Fetch Selenium
      run: |
        mkdir -p jars
        curl -sSLf -o jars/selenium-3.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar
        curl -sSLf -o jars/selenium-4.29.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.29.0/selenium-server-4.29.0.jar
        curl -sSLf -o jars/selenium-4.51.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.51.0/selenium-server-4.51.0.jar

    - name: Stress
      run: |
        DRIVER=/usr/bin/safaridriver
        sudo "$DRIVER" --enable
        mkdir -p out
        /usr/bin/log stream --style compact --level info --predicate \
          'subsystem BEGINSWITH "com.apple.WebDriver" OR process CONTAINS "WebDriver" OR process == "safaridriver" OR process == "webinspectord" OR category == "Automation"' \
          > out/webdriver-log-stream.txt 2>&1 &
        STREAM=$!
        python3 .github/diagnostics/safari-launch-stress.py out \
          --rounds 1000 --per-round 3 --max-minutes 40 --modes ${{ matrix.modes }} \
          --safaridriver "$DRIVER" --browser safari --java "$JAVA_HOME/bin/java" \
          --sel3-jar jars/selenium-3.jar --sel4-jar jars/selenium-4.29.jar --sel4new-jar jars/selenium-4.51.jar \
          --selenium-timeout 75
        kill $STREAM
        grep -E 'webinspectord.*(Shutting|last client)' out/webdriver-log-stream.txt | tail -40 || true

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: launch-stress-${{ matrix.runner }}-${{ matrix.modes }}
        path: out/
